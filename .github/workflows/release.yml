name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build release zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = ""
          if ("${{ github.ref }}" -like "refs/tags/*") {
              $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version) {
              python tools/build_release_zip.py --version $version
          } else {
              python tools/build_release_zip.py
          }

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: RELEASE_NOTES.md

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download numpy wheel (macOS arm64, cp313)
        run: |
          set -euo pipefail
          python -m pip download --no-deps --only-binary=:all: \
            --platform macosx_11_0_arm64 --python-version 3.13 \
            --implementation cp --abi cp313 -d wheel "numpy==2.3.0"
          mkdir -p vendor
          unzip -q wheel/numpy-*.whl -d vendor

      - name: Build release zip
        run: |
          set -euo pipefail
          VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "$VERSION" ]]; then
            python tools/build_release_zip.py --version "$VERSION" \
              --vendor vendor --target macos-arm64-krita5.3
          else
            python tools/build_release_zip.py \
              --vendor vendor --target macos-arm64-krita5.3
          fi

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: RELEASE_NOTES.md
